
name: Discover Trending Gaming Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: gaming-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Search trending gaming candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover gaming videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/discover_trending.py

      - name: Save discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-trend-report-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
