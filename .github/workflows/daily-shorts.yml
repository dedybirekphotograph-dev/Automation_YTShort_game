name: Build and upload approved Gaming Short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB
    - cron: "0 5 * * *"   # 12:00 WIB
    - cron: "0 9 * * *"   # 16:00 WIB
    - cron: "0 13 * * *"  # 20:00 WIB

permissions:
  contents: read

concurrency:
  group: gaming-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build and upload private Short
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python src/build_and_upload.py

      - name: Keep build result for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-shorts-log-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 2
