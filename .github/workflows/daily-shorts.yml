
name: Discover and build Gaming Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: gaming-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover eligible gaming videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/discover_trending.py

      - name: Build approved clips
        run: python src/build_and_upload.py

      - name: Save MP4 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-shorts-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7
